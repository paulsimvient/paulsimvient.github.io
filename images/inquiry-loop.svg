<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" role="img" aria-labelledby="t d">
  <title id="t">Inquiry loop</title>
  <desc id="d">Observe, Frame, Test, Validate, Return</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#994220"/>
    </marker>
  </defs>
  <rect width="920" height="160" fill="#f3efe6"/>
  <g font-family="Manrope, Avenir Next, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
    <g transform="translate(40,40)">
      <rect width="140" height="80" rx="40" fill="#102928"/>
      <text x="70" y="47" text-anchor="middle" fill="#f3efe6">OBSERVE</text>
    </g>
    <line x1="190" y1="80" x2="220" y2="80" stroke="#994220" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(230,40)">
      <rect width="140" height="80" rx="40" fill="#102928"/>
      <text x="70" y="47" text-anchor="middle" fill="#f3efe6">FRAME</text>
    </g>
    <line x1="380" y1="80" x2="410" y2="80" stroke="#994220" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(420,40)">
      <rect width="140" height="80" rx="40" fill="#994220"/>
      <text x="70" y="47" text-anchor="middle" fill="#fff">TEST</text>
    </g>
    <line x1="570" y1="80" x2="600" y2="80" stroke="#994220" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(610,40)">
      <rect width="140" height="80" rx="40" fill="#102928"/>
      <text x="70" y="47" text-anchor="middle" fill="#f3efe6">VALIDATE</text>
    </g>
    <line x1="760" y1="80" x2="790" y2="80" stroke="#994220" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(800,40)">
      <rect width="100" height="80" rx="40" fill="#102928"/>
      <text x="50" y="47" text-anchor="middle" fill="#f3efe6" font-size="15">RETURN</text>
    </g>
  </g>
</svg>
