<g font-family="Arial, Helvetica, sans-serif"><text x="110" y="125" fill="#102928" font-size="65" font-weight="700" text-anchor="start">Questions worth testing</text><text x="112" y="181" fill="#994220" font-size="27" font-weight="500" text-anchor="start">Make assumptions and disagreement visible</text>
<rect x="130" y="280" width="1640" height="100" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="170" y="345" fill="#994220" font-size="37" font-weight="700" text-anchor="start">01</text><text x="300" y="345" fill="#102928" font-size="33" font-weight="500" text-anchor="start">What else could explain the pattern?</text><rect x="130" y="415" width="1640" height="100" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="170" y="480" fill="#994220" font-size="37" font-weight="700" text-anchor="start">02</text><text x="300" y="480" fill="#102928" font-size="33" font-weight="500" text-anchor="start">Which intervention would distinguish explanations?</text><rect x="130" y="550" width="1640" height="100" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="170" y="615" fill="#994220" font-size="37" font-weight="700" text-anchor="start">03</text><text x="300" y="615" fill="#102928" font-size="33" font-weight="500" text-anchor="start">How sensitive is the result to assumptions?</text><rect x="130" y="685" width="1640" height="100" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="170" y="750" fill="#994220" font-size="37" font-weight="700" text-anchor="start">04</text><text x="300" y="750" fill="#102928" font-size="33" font-weight="500" text-anchor="start">What happens under held-out conditions?</text><rect x="130" y="820" width="1640" height="100" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="170" y="885" fill="#994220" font-size="37" font-weight="700" text-anchor="start">05</text><text x="300" y="885" fill="#102928" font-size="33" font-weight="500" text-anchor="start">Who has authority to act?</text></g><text x="110" y="1035" fill="#102928" font-family="Arial" font-size="20">THINKING TOGETHER  /  PAUL CUMMINGS, Ph.D.   •   Conceptual illustration — not measured results</text></svg>