<g font-family="Arial, Helvetica, sans-serif"><text x="110" y="125" fill="#102928" font-size="65" font-weight="700" text-anchor="start">The evidence registry</text><text x="112" y="181" fill="#994220" font-size="27" font-weight="500" text-anchor="start">Remember claims together with their qualifications</text>
<rect x="110" y="360" width="310" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="134" y="405" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Claim</text><text x="134" y="442" fill="#102928" font-size="18" font-weight="500" text-anchor="start">What is being asserted</text><path d="M420,420 L460,420" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="465" y="360" width="310" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="489" y="405" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Evidence</text><text x="489" y="442" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Which runs support it</text><path d="M775,420 L815,420" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="820" y="360" width="310" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="844" y="405" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Limits</text><text x="844" y="442" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Where it may fail</text><path d="M1130,420 L1170,420" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="1175" y="360" width="310" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="1199" y="405" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Provenance</text><text x="1199" y="442" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Where it came from</text><path d="M1485,420 L1525,420" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="1530" y="360" width="310" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="1554" y="405" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Revision</text><text x="1554" y="442" fill="#102928" font-size="18" font-weight="500" text-anchor="start">What changed</text><text x="115" y="700" fill="#102928" font-size="36" font-weight="500" text-anchor="start">An inspectable knowledge record can be challenged and updated.</text></g><text x="110" y="1035" fill="#102928" font-family="Arial" font-size="20">THINKING TOGETHER  /  PAUL CUMMINGS, Ph.D.   •   Conceptual illustration — not measured results</text></svg>