<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#f3efe6"/>
<rect x="0" y="0" width="24" height="1080" fill="#994220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="110" y="125" fill="#102928" font-size="65" font-weight="700" text-anchor="start">From data to judgment</text><text x="112" y="181" fill="#994220" font-size="27" font-weight="500" text-anchor="start">An evidence trail that people can inspect</text>
<rect x="150" y="235" width="550" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="174" y="280" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Observations</text><text x="174" y="317" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Source and timing</text><path d="M420,355 L420,378" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="150" y="380" width="550" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="174" y="425" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Models</text><text x="174" y="462" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Alternative explanations</text><path d="M420,500 L420,523" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="150" y="525" width="550" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="174" y="570" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Experiments</text><text x="174" y="607" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Controlled changes</text><path d="M420,645 L420,668" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="150" y="670" width="550" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="174" y="715" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Evidence</text><text x="174" y="752" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Effects and uncertainty</text><path d="M420,790 L420,813" fill="none" stroke="#994220" stroke-width="4" stroke-dasharray=""/><rect x="150" y="815" width="550" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="174" y="860" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Human review</text><text x="174" y="897" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Context and judgment</text><rect x="890" y="280" width="810" height="610" rx="16" fill="#e6ece9" stroke="none" stroke-width="2"/><text x="970" y="385" fill="#102928" font-size="46" font-weight="700" text-anchor="start">Keep distinctions visible</text><text x="970" y="480" fill="#102928" font-size="31" font-weight="500" text-anchor="start">• What happened?</text><text x="970" y="554" fill="#102928" font-size="31" font-weight="500" text-anchor="start">• What was observed?</text><text x="970" y="628" fill="#102928" font-size="31" font-weight="500" text-anchor="start">• What was assumed?</text><text x="970" y="702" fill="#102928" font-size="31" font-weight="500" text-anchor="start">• What could disconfirm the model?</text><text x="970" y="776" fill="#102928" font-size="31" font-weight="500" text-anchor="start">• What should a person decide?</text></g><text x="110" y="1035" fill="#102928" font-family="Arial" font-size="20">THINKING TOGETHER  /  PAUL CUMMINGS, Ph.D.   •   Conceptual illustration — not measured results</text></svg>