<g font-family="Arial, Helvetica, sans-serif"><text x="110" y="125" fill="#102928" font-size="65" font-weight="700" text-anchor="start">From insight to practice</text><text x="112" y="181" fill="#994220" font-size="27" font-weight="500" text-anchor="start">Evidence should change what we know how to test</text>
<rect x="110" y="375" width="400" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="134" y="420" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Observe</text><text x="134" y="457" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Describe the situation</text><path d="M510,430 L555,430" fill="none" stroke="#994220" stroke-width="5" stroke-dasharray=""/><rect x="560" y="375" width="400" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="584" y="420" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Experiment</text><text x="584" y="457" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Compare interventions</text><path d="M960,430 L1005,430" fill="none" stroke="#994220" stroke-width="5" stroke-dasharray=""/><rect x="1010" y="375" width="400" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="1034" y="420" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Validate</text><text x="1034" y="457" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Qualify evidence</text><path d="M1410,430 L1455,430" fill="none" stroke="#994220" stroke-width="5" stroke-dasharray=""/><rect x="1460" y="375" width="400" height="120" rx="16" fill="#fffaf2" stroke="none" stroke-width="2"/><text x="1484" y="420" fill="#102928" font-size="27" font-weight="700" text-anchor="start">Transfer</text><text x="1484" y="457" fill="#102928" font-size="18" font-weight="500" text-anchor="start">Teach useful methods</text><text x="120" y="700" fill="#102928" font-size="34" font-weight="500" text-anchor="start">The outcome is a better method of inquiry, not simply another answer.</text></g><text x="110" y="1035" fill="#102928" font-family="Arial" font-size="20">THINKING TOGETHER  /  PAUL CUMMINGS, Ph.D.   •   Conceptual illustration — not measured results</text></svg>